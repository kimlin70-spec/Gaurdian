<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="숲의 수호자">
  <title>숲의 수호자</title>
  <link rel="stylesheet" href="vendor/fonts/galmuri.css">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden;
      touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { width: 100%; height: 100%; }
    #game canvas { touch-action: none; }
    #rotate {
      display: none; position: fixed; inset: 0; background: #1a1b2e; color: #fff;
      font-family: Galmuri14, Galmuri11, sans-serif; font-size: 36px; text-align: center;
      align-items: center; justify-content: center; z-index: 10; line-height: 1.6;
    }
    @media (orientation: portrait) { #rotate { display: flex; } }
    .fontpre { position: absolute; left: -9999px; top: -9999px; visibility: hidden; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate"><p>아이패드를<br>가로로 돌려 주세요 ↻</p></div>
  <span class="fontpre" style="font-family:Galmuri11">가</span>
  <span class="fontpre" style="font-family:Galmuri11;font-weight:700">가</span>
  <span class="fontpre" style="font-family:Galmuri14">가</span>
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
